# openenv.yaml — Environment manifest for DevOps/FinOps OpenEnv v2.0
# Validated with: openenv validate

title: "OpenEnv DevOps FinOps Cloud Optimizer"
emoji: "☁️"
colorFrom: blue
colorTo: purple
app_port: 7860
tags:
  - openenv

spec_version: 1

name: devops-finops-cloud-optimizer
version: "2.0.0"
description: >
  AI agent environment for cloud infrastructure cost vs performance optimization.
  Agents manage a simulated fleet of cloud servers with 4 resource dimensions
  (CPU, RAM, disk IOPS, network), spot instance eviction, cascading workload
  failures, and deterministic traffic spikes. Supports 3 fixed difficulty tiers
  plus procedural generation for unlimited evaluation scenarios.
author: "aryanpatel"

docker_port: 7860

# ── Tasks ──────────────────────────────────────────────────────────────

tasks:
  - id: easy
    name: "Single Server Rightsizing"
    description: >
      Two workloads run on a massively over-provisioned xlarge server.
      Resize to the smallest instance that fits both workloads' CPU+RAM+disk+net
      needs without breaching SLAs. Budget: $0.25/hr.
    difficulty: easy
    max_steps: 5

  - id: medium
    name: "Multi-Service Consolidation"
    description: >
      Four workloads each run on their own oversized server (total $2.40/hr).
      Consolidate onto fewer, right-sized servers. wl-api depends on wl-db
      (cascading failure). Budget: $0.50/hr.
    difficulty: medium
    max_steps: 10

  - id: hard
    name: "Fleet Chaos Triage"
    description: >
      Diagnose and fix a broken fleet with 3 SLA breaches, 1 orphaned workload,
      1 idle server, cascading failures (wl-api→wl-auth, wl-search→wl-db),
      and over-provisioning. Budget: $1.20/hr.
    difficulty: hard
    max_steps: 15

# NOTE: Procedural generation is also supported via task_id="random" + seed parameter.
# This generates unique fleet configurations for unlimited evaluation scenarios.

# ── Observation Space ──────────────────────────────────────────────────

observation_space:
  servers:
    type: "List[ServerInfo]"
    description: "All active server instances in the fleet"
    fields:
      server_id: "Unique server identifier (e.g. 'srv-001')"
      instance_type: "Instance tier from the 11-type catalog"
      cpu_cores: "Number of vCPU cores"
      ram_gb: "RAM in GB"
      disk_iops: "Disk I/O operations per second"
      network_gbps: "Network bandwidth in Gbps"
      cpu_utilization: "Current CPU usage (uncapped, can exceed 1.0 = overloaded)"
      ram_utilization: "Current RAM usage (uncapped)"
      disk_utilization: "Current disk IOPS usage (uncapped)"
      network_utilization: "Current network usage (uncapped)"
      cost_per_hour: "Hourly cost in USD"
      assigned_workloads: "List of workload IDs running on this server"
      is_spot: "True if this is a spot instance (can be evicted)"
      is_overloaded: "True if any resource dimension exceeds 100%"

  workloads:
    type: "List[WorkloadInfo]"
    description: "All workloads that must be kept running"
    fields:
      workload_id: "Unique workload identifier"
      name: "Human-readable workload name"
      required_cpu: "Minimum CPU cores needed"
      required_ram: "Minimum RAM in GB needed"
      required_disk_iops: "Minimum disk IOPS needed"
      required_net_gbps: "Minimum network bandwidth in Gbps needed"
      current_latency_ms: "Current p95 response latency in ms"
      sla_latency_ms: "Maximum acceptable p95 latency before SLA breach"
      is_critical: "If true, SLA breach carries 2x penalty weight"
      assigned_server: "Server ID where workload runs, or null if unassigned"
      dependencies: "List of workload IDs this workload depends on (cascading failures)"

  total_cost_per_hour:
    type: float
    description: "Sum of all running server costs in USD/hr"

  budget_per_hour:
    type: float
    description: "Target budget the agent should optimize toward in USD/hr"

  sla_violations:
    type: int
    description: "Count of workloads currently breaching their latency SLA"

  unassigned_workloads:
    type: int
    description: "Count of workloads not running on any server (DOWN)"

  step_number:
    type: int
    description: "Current step in the episode (0-indexed)"

  max_steps:
    type: int
    description: "Maximum steps allowed before episode ends"

  done:
    type: bool
    description: "True if the episode is over"

  message:
    type: str
    description: "Structured feedback with prefix: [OK], [ERROR:*], [WARN:*], [DESTRUCTIVE], [EVICTION]"

  traffic_multiplier_active:
    type: bool
    description: "True if seed-based traffic fluctuation is active"

  spot_eviction_occurred:
    type: bool
    description: "True if a spot instance was evicted this step"

# ── Action Space ───────────────────────────────────────────────────────

action_space:
  action_type:
    type: "Literal['provision', 'terminate', 'resize', 'migrate', 'noop']"
    description: "The infrastructure operation to perform"

  server_id:
    type: "Optional[str]"
    description: "Target server for terminate/resize actions"

  instance_type:
    type: "Optional[str]"
    description: "Instance tier for provision/resize (11 types available)"

  workload_id:
    type: "Optional[str]"
    description: "Workload to move for migrate actions"

  target_server_id:
    type: "Optional[str]"
    description: "Destination server for migrate actions"

# ── Reward ─────────────────────────────────────────────────────────────

reward_range: [0.0, 1.0]
reward_formula: >
  score = (cost_efficiency × 0.40) + (performance × 0.35) − (penalty × 0.25)
  Clamped to [0.0, 1.0]. If performance=0 (all unhealthy), cost_efficiency is zeroed.
  Destructive termination incurs 0.50 penalty per occurrence (very severe at 0.25 weight).
